# Every push and pull request: ESLint and tsc, tests with coverage, chart and
# kustomize rendering, and an image build for both architectures.
# Pushes to master also publish the image as ghcr.io/giovannirco/arith-ts:sha-<short>.
# A tag made of digits (git tag 2 && git push origin 2) publishes the image as
# :2 and :latest, and the chart to oci://ghcr.io/giovannirco/charts with that
# app version.
name: ci

on:
  push:
    branches: [master]
    tags: ["[0-9]+"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/giovannirco/arith-ts
  CHARTS: oci://ghcr.io/giovannirco/charts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node from .node-version, packages from package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run cover
      - name: Coverage summary
        run: |
          {
            echo '### Coverage of src/'
            jq -r '.total | "\(.lines.pct)% of lines, \(.branches.pct)% of branches"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: helm lint deploy/helm/arith-ts
      - run: helm lint deploy/helm/arith-ts -f deploy/helm/arith-ts/ci/all-on-values.yaml
      - run: helm template arith deploy/helm/arith-ts -n arith > /dev/null
      - run: helm template arith deploy/helm/arith-ts -n arith -f deploy/helm/arith-ts/ci/all-on-values.yaml > /dev/null
      # --set image.tag=2 arrives as an integer; the image line must still read :2.
      # Quoted: a bare `image: ` in a YAML scalar is a mapping and GitHub
      # refuses the workflow file.
      - run: "helm template arith deploy/helm/arith-ts -n arith --set image.tag=2 | grep -q 'image: \"ghcr.io/giovannirco/arith-ts:2\"'"
      - run: kubectl kustomize deploy/kustomize/base > /dev/null
      - run: kubectl kustomize deploy/kustomize/overlays/example > /dev/null

  image:
    needs: [test]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [image, manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${DOCKER_METADATA_OUTPUT_VERSION}"

  chart:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: helm package deploy/helm/arith-ts --app-version "$GITHUB_REF_NAME" --destination /tmp/chart
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: helm push /tmp/chart/arith-*.tgz "$CHARTS"

