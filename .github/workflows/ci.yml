# Every push and pull request: ESLint and tsc, tests with coverage, chart and
# kustomize rendering, and an image build for both architectures.
# Pushes to master also publish the image as ghcr.io/giovannirco/arith-ts:sha-<short>.
# A tag made of digits (git tag 2 && git push origin 2) publishes the image as
# :2 and :latest, and the chart to oci://ghcr.io/giovannirco/charts with that
# app version. The chart job fails if Chart.yaml's version is already published.
# Every push to master or a tag also pushes the Artifact Hub repository
# metadata to the chart's artifacthub.io tag.
name: ci

on:
  push:
    branches: [master]
    tags: ["[0-9]+"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/giovannirco/arith-ts
  CHARTS: oci://ghcr.io/giovannirco/charts
  CHART_REPO: ghcr.io/giovannirco/charts/arith-ts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node from .node-version, packages from package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run cover
      - name: Coverage summary
        run: |
          {
            echo '### Coverage of src/'
            jq -r '.total | "\(.lines.pct)% of lines, \(.branches.pct)% of branches"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The chart carries its own copy of the license; keep it identical.
      - run: cmp LICENSE deploy/helm/arith-ts/LICENSE
      - run: helm lint deploy/helm/arith-ts
      - run: helm lint deploy/helm/arith-ts -f deploy/helm/arith-ts/ci/all-on-values.yaml
      - run: helm template arith deploy/helm/arith-ts -n arith > /dev/null
      - run: helm template arith deploy/helm/arith-ts -n arith -f deploy/helm/arith-ts/ci/all-on-values.yaml > /dev/null
      # --set image.tag=2 arrives as an integer; the image line must still read :2.
      # Quoted: a bare `image: ` in a YAML scalar is a mapping and GitHub
      # refuses the workflow file.
      - run: "helm template arith deploy/helm/arith-ts -n arith --set image.tag=2 | grep -q 'image: \"ghcr.io/giovannirco/arith-ts:2\"'"
      - run: kubectl kustomize deploy/kustomize/base > /dev/null
      - run: kubectl kustomize deploy/kustomize/overlays/example > /dev/null

  image:
    needs: [test]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [image, manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${DOCKER_METADATA_OUTPUT_VERSION}"

  chart:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The chart has its own semver. A git tag changes the default image, so
      # it needs a new chart version too; never overwrite a published one.
      - name: Refuse a chart version that is already on GHCR
        shell: bash
        run: |
          version="$(yq .version deploy/helm/arith-ts/Chart.yaml)"
          # Ask for this exact version. A chart that was never published, or
          # a package that does not exist yet, answers "not found" or
          # "denied"; anything else is an error worth stopping for.
          if oras manifest fetch "$CHART_REPO:$version" > /dev/null 2> lookup.err; then
            echo "::error file=deploy/helm/arith-ts/Chart.yaml::chart $version is already on GHCR; bump version in Chart.yaml"
            exit 1
          fi
          grep -qiE 'not found|denied|unknown' lookup.err || { cat lookup.err; exit 1; }
      # Git keeps appVersion "1" so the README walkthrough (build 2, roll it
      # out) shows a rollout. The published chart defaults to the image it
      # ships with, and its Artifact Hub image annotation says the same.
      - name: Point appVersion and the image annotation at this tag
        shell: bash
        working-directory: deploy/helm/arith-ts
        run: |
          yq -i ".appVersion = \"$GITHUB_REF_NAME\" |
                 .annotations[\"artifacthub.io/images\"] |= sub(\"$IMAGE:[0-9]+\", \"$IMAGE:$GITHUB_REF_NAME\")" Chart.yaml
          test "$(yq '.annotations["artifacthub.io/images"] | from_yaml | .[0].image' Chart.yaml)" = "$IMAGE:$GITHUB_REF_NAME"
      - run: helm package deploy/helm/arith-ts --destination /tmp/chart
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: helm push /tmp/chart/arith-*.tgz "$CHARTS"

  # Artifact Hub reads the repository metadata (verified publisher, owners)
  # from the artifacthub.io tag next to the chart, as its docs describe for
  # OCI. Pushed on every push to master and every tag, so an edited
  # artifacthub-repo.yml reaches Artifact Hub without waiting for a release.
  artifacthub:
    needs: [manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the Artifact Hub repository metadata
        working-directory: deploy/helm/arith-ts
        run: |
          oras push "$CHART_REPO:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
